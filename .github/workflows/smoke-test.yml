name: Smoke Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run smoke test
        env:
          REPO_ROOT: ${{ github.workspace }}
        run: bash tests/integration/smoke-test.sh
