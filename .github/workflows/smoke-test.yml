name: Smoke Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Weekly on Monday at 06:00 UTC — catches runner/image drift
    - cron: '0 6 * * 1'

# Limit GITHUB_TOKEN to read-only to reduce blast radius.
permissions:
  contents: read

jobs:
  smoke-ubuntu:
    name: Smoke (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install Podman
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y podman

      - name: Run full smoke suite
        env:
          REPO_ROOT: ${{ github.workspace }}
        run: bash tests/integration/smoke-all.sh

  smoke-almalinux:
    name: Smoke (AlmaLinux 9 / kvm151)
    # Only trusted triggers — never pull_request (public repo, self-hosted runner).
    if: github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, almalinux9]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # Remove leftovers from cancelled runs (name conflicts). Safe only because
      # the runner's account (ghrunner) has a dedicated Podman with nothing else in it.
      - name: Pre-clean Podman state
        run: podman rm -af && podman network prune -f

      - name: Run full smoke suite
        env:
          REPO_ROOT: ${{ github.workspace }}
        run: bash tests/integration/smoke-all.sh
