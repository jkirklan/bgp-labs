[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "bgp-labs"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.0",
    "rich>=13.0",
]

[project.scripts]
packet-watch = "labs.tools.packet_watch.packet_watch:main"

[tool.setuptools.package-dir]
"labs"                      = "."
"labs.lib"                  = "lib"
"labs.tools"                = "tools"
"labs.tools.packet_watch"   = "tools/packet_watch"
"labs.tools.topology_watch" = "tools/topology_watch"

[tool.setuptools]
packages = [
    "labs",
    "labs.lib",
    "labs.tools",
    "labs.tools.packet_watch",
    "labs.tools.topology_watch",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
