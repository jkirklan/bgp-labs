hostname router-b
!
interface eth0
 ip address 10.0.12.2/30
!
interface eth1
 ip address 10.0.23.1/30
!
router bgp 65002
 bgp router-id 10.0.12.2
 no bgp ebgp-requires-policy
 ! TODO: add a neighbor statement for router-a (AS65001) on 10.0.12.1
 ! neighbor <ip> remote-as <asn>
 ! TODO: add a neighbor statement for router-c (AS65003) on 10.0.23.2
 ! neighbor <ip> remote-as <asn>
 !
 address-family ipv4 unicast
  ! TODO: activate both neighbors
  ! TODO: add next-hop-self to each neighbor so router-b rewrites NEXT_HOP
  ! neighbor <ip> activate
  ! neighbor <ip> next-hop-self
 exit-address-family
!
line vty
!
