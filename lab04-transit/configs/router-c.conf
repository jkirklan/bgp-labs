hostname router-c
!
interface eth0
 ip address 10.0.23.2/30
!
interface eth1
 ip address 192.168.3.1/24
!
router bgp 65003
 bgp router-id 10.0.23.2
 no bgp ebgp-requires-policy
 ! TODO: add a neighbor statement for router-b (AS65002) on 10.0.23.1
 ! neighbor <ip> remote-as <asn>
 !
 address-family ipv4 unicast
  ! TODO: activate the neighbor and advertise router-c's internal prefix
  ! neighbor <ip> activate
  ! network <prefix>
 exit-address-family
!
line vty
!
