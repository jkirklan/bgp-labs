hostname pe1
!
! VRF-A and VRF-B with L3VNI bindings for EVPN symmetric IRB.
! The kernel VRF, VXLAN interfaces, and bridge are set up by setup.sh.
vrf VRF-A
 vni 100
!
vrf VRF-B
 vni 200
!
interface eth0
 ip address 10.0.12.1/30
!
! eth1 (VRF-A, 192.168.10.1/24) and eth2 (VRF-B, 192.168.30.1/24)
! are enslaved to their VRFs by setup.sh after FRR starts.
! FRR learns VRF membership via netlink.
!
router bgp 65001
 bgp router-id 10.0.12.1
 no bgp ebgp-requires-policy
 neighbor 10.0.12.2 remote-as 65002
 !
 address-family ipv4 unicast
  neighbor 10.0.12.2 activate
 exit-address-family
 !
 address-family l2vpn evpn
  neighbor 10.0.12.2 activate
  advertise-all-vni
 exit-address-family
!
router bgp 65001 vrf VRF-A
 bgp router-id 192.168.10.1
 !
 address-family ipv4 unicast
  redistribute connected
  rd vpn export 65001:100
  rt vpn both 65001:100
  export vpn
  import vpn
 exit-address-family
!
router bgp 65001 vrf VRF-B
 bgp router-id 192.168.30.1
 !
 address-family ipv4 unicast
  redistribute connected
  rd vpn export 65001:200
  rt vpn both 65001:200
  export vpn
  import vpn
 exit-address-family
!
line vty
!
