hostname customer
!
interface eth0
 ip address 10.0.12.1/30
!
interface eth1
 ip address 10.0.13.1/30
!
interface lo
 ip address 192.168.100.1/24
!
! Customer is dual-homed: eth0 = primary ISP, eth1 = backup ISP
! Use LOCAL_PREF to prefer the primary path:
!   Routes from primary ISP get LOCAL_PREF=200 (preferred)
!   Routes from backup ISP get LOCAL_PREF=100 (default, less preferred)
router bgp 65001
 bgp router-id 10.0.12.1
 no bgp ebgp-requires-policy
 neighbor 10.0.12.2 remote-as 65002
 neighbor 10.0.12.2 timers 3 9
 neighbor 10.0.13.2 remote-as 65003
 neighbor 10.0.13.2 timers 3 9
 !
 address-family ipv4 unicast
  network 192.168.100.0/24
  neighbor 10.0.12.2 activate
  neighbor 10.0.12.2 next-hop-self
  ! Set LOCAL_PREF=200 for routes received from primary ISP
  neighbor 10.0.12.2 route-map PRIMARY-IN in
  neighbor 10.0.13.2 activate
  neighbor 10.0.13.2 next-hop-self
  ! Set LOCAL_PREF=100 for routes received from backup ISP (default)
  neighbor 10.0.13.2 route-map BACKUP-IN in
 exit-address-family
!
route-map PRIMARY-IN permit 10
 set local-preference 200
!
route-map BACKUP-IN permit 10
 set local-preference 100
!
line vty
!
