hostname router-b
!
interface eth0
 ip address 10.0.12.2/30
!
interface eth1
 ip address 192.168.2.1/24
!
router bgp 65002
 bgp router-id 10.0.12.2
 no bgp ebgp-requires-policy
 ! TODO: add a neighbor statement for router-a
 ! Hint: router-a's IP on the shared link is 10.0.12.1 (check router-a.conf)
 ! neighbor <ip> remote-as <asn>
 !
 address-family ipv4 unicast
  ! TODO: activate the neighbor and advertise router-b's internal prefix
  ! neighbor <ip> activate
  ! network 192.168.2.0/24
 exit-address-family
!
line vty
!
