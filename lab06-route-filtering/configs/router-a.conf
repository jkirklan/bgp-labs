hostname router-a
!
interface eth0
 ip address 10.0.12.1/30
!
! Static Null0 routes satisfy bgp network import-check (FRR default: on)
ip route 192.168.1.0/24 Null0
ip route 192.168.2.0/24 Null0
ip route 10.0.0.0/8 Null0
!
! AS65001 advertises three prefixes; only some should be accepted by the ISP
router bgp 65001
 bgp router-id 10.0.12.1
 no bgp ebgp-requires-policy
 neighbor 10.0.12.2 remote-as 65002
 !
 address-family ipv4 unicast
  network 192.168.1.0/24
  network 192.168.2.0/24
  network 10.0.0.0/8
  neighbor 10.0.12.2 activate
 exit-address-family
!
line vty
!
