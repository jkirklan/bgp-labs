hostname router-b
!
interface eth0
 ip address 10.0.12.2/30
!
interface eth1
 ip address 10.0.23.1/30
!
! router-b is the ISP. It filters inbound routes from router-a.
! TODO: apply a prefix-list inbound to router-a's session that:
!   PERMIT: 192.168.1.0/24, 192.168.2.0/24
!   DENY:   10.0.0.0/8 (bogon/too-large)
router bgp 65002
 bgp router-id 10.0.12.2
 no bgp ebgp-requires-policy
 neighbor 10.0.12.1 remote-as 65001
 neighbor 10.0.23.2 remote-as 65003
 !
 address-family ipv4 unicast
  neighbor 10.0.12.1 activate
  neighbor 10.0.12.1 next-hop-self
  neighbor 10.0.12.1 soft-reconfiguration inbound
  ! TODO: neighbor 10.0.12.1 prefix-list CUSTOMER-IN in
  neighbor 10.0.23.2 activate
  neighbor 10.0.23.2 next-hop-self
 exit-address-family
!
! TODO: define the prefix-list CUSTOMER-IN:
! ip prefix-list CUSTOMER-IN seq 10 permit 192.168.1.0/24
! ip prefix-list CUSTOMER-IN seq 20 permit 192.168.2.0/24
! ip prefix-list CUSTOMER-IN seq 100 deny any
!
line vty
!
