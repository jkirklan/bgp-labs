hostname transit
!
interface eth0
 ip address 10.0.10.1/30
!
interface eth1
 ip address 10.0.20.1/30
!
interface eth2
 ip address 10.0.30.1/30
!
! TODO: set up community-based policy on the transit router
! The transit router should:
!   1. Tag routes from customers with community 65000:100
!   2. Tag routes from the peer with community 65000:200
!   3. Only advertise customer routes (65000:100) to the peer
!      (do NOT advertise peer routes to other customers)
router bgp 65000
 bgp router-id 10.0.10.1
 no bgp ebgp-requires-policy
 neighbor 10.0.10.2 remote-as 65001
 neighbor 10.0.20.2 remote-as 65002
 neighbor 10.0.30.2 remote-as 65003
 !
 address-family ipv4 unicast
  neighbor 10.0.10.2 activate
  neighbor 10.0.10.2 next-hop-self
  neighbor 10.0.20.2 activate
  neighbor 10.0.20.2 next-hop-self
  neighbor 10.0.30.2 activate
  neighbor 10.0.30.2 next-hop-self
  ! TODO: neighbor 10.0.10.2 route-map CUST-IN in
  ! TODO: neighbor 10.0.10.2 route-map CUST-ONLY-OUT out
  ! TODO: neighbor 10.0.20.2 route-map CUST-IN in
  ! TODO: neighbor 10.0.20.2 route-map CUST-ONLY-OUT out
  ! TODO: neighbor 10.0.30.2 route-map PEER-IN in
  ! TODO: neighbor 10.0.30.2 route-map CUST-ONLY-OUT out
 exit-address-family
!
! TODO: define route-maps and community-lists:
!
! bgp community-list standard CUSTOMER permit 65000:100
! bgp community-list standard PEER permit 65000:200
!
! route-map CUST-IN permit 10
!  set community 65000:100
!
! route-map PEER-IN permit 10
!  set community 65000:200
!
! route-map CUST-ONLY-OUT permit 10
!  match community CUSTOMER
!
! route-map CUST-ONLY-OUT deny 100
!
line vty
!
