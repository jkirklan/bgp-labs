hostname cust-a
!
interface eth0
 ip address 10.0.10.2/30
!
router bgp 65001
 bgp router-id 10.0.10.2
 no bgp ebgp-requires-policy
 neighbor 10.0.10.1 remote-as 65000
 !
 address-family ipv4 unicast
  network 172.16.1.0/24
  neighbor 10.0.10.1 activate
  ! Attach community 65000:100 to routes — signals "customer route"
  neighbor 10.0.10.1 send-community
 exit-address-family
!
line vty
!
