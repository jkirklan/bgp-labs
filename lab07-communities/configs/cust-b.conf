hostname cust-b
!
interface eth0
 ip address 10.0.20.2/30
!
router bgp 65002
 bgp router-id 10.0.20.2
 no bgp ebgp-requires-policy
 neighbor 10.0.20.1 remote-as 65000
 !
 address-family ipv4 unicast
  network 172.16.2.0/24
  neighbor 10.0.20.1 activate
  neighbor 10.0.20.1 send-community
 exit-address-family
!
line vty
!
